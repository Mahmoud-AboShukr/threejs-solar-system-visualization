<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sun–Earth–Moon Hierarchical System</title>
  <style>
    html, body { margin:0; height:100%; background:#000; }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from 'https://unpkg.com/three@0.174.0/build/three.module.min.js';

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// ===== Camera =====
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 100, 300);
camera.lookAt(0, 0, 0);

// ===== Renderer =====
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// ===== Lights =====
const sunLight = new THREE.PointLight(0xffffff, 4, 0);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

const ambient = new THREE.AmbientLight(0xffffff, 0.4);
scene.add(ambient);

// ===== Sun (Mesh) =====
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(50, 48, 32),
  new THREE.MeshBasicMaterial({
    color: 0xffff00,
    emissive: 0xffcc00,
    emissiveIntensity: 1.3
  })
);
scene.add(sun);

// ===== Joint 1 (Earth orbit) =====
const joint1 = new THREE.Object3D();
sun.add(joint1);

// ===== Earth (Mesh) =====
const earth = new THREE.Mesh(
  new THREE.SphereGeometry(8, 32, 24),
  new THREE.MeshLambertMaterial({ color: 0x1e90ff })
);
// Earth–Sun distance (scaled)
earth.position.set(150, 0, 0);
joint1.add(earth);

// ===== Joint 2 (Moon orbit) =====
const joint2 = new THREE.Object3D();
joint1.add(joint2);
joint2.position.copy(earth.position); // orbit around Earth position

// ===== Moon (Mesh) =====
const moon = new THREE.Mesh(
  new THREE.SphereGeometry(2.5, 32, 24), // slightly larger for better visibility
  new THREE.MeshLambertMaterial({ color: 0xdddddd })
);
// Earth–Moon distance (scaled)
moon.position.set(25, 0, 0); // 150 + 25 units
joint2.add(moon);

// ===== Orbital periods =====
const EARTH_PERIOD = 60; // seconds per orbit
const MOON_PERIOD = 5;   // seconds per orbit around Earth
const TAU = Math.PI * 2;

// ===== Animation loop =====
renderer.setAnimationLoop((ms) => {
  const t = ms * 0.001;

  // Earth orbit around Sun
  joint1.rotation.y = (t / EARTH_PERIOD) * TAU;

  // Moon orbit around Earth
  joint2.rotation.y = (t / MOON_PERIOD) * TAU;

  // Self-rotations
  sun.rotation.y += 0.002;
  earth.rotation.y += 0.02;
  moon.rotation.y += 0.01;

  renderer.render(scene, camera);
});

// ===== Resize =====
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
