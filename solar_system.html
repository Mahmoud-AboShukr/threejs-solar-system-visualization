<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Solar Fuckin System TD</title>
  <style>
    html, body { margin:0; height:100%; background:#000; }
    canvas { display:block; width:100%; height:100%; }
  </style>
</head>
<body>

<script type="module">
import * as THREE from 'https://unpkg.com/three@0.174.0/build/three.module.min.js';

// SCENE
// A scene holds everything we draw: planets, lights, camera.
// We set the background to black (space).
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x000000);

// CAMERA
// A PerspectiveCamera imitates a real human eye.
// 60° field of view
// 0.1 → 5000 is the visible depth range.
// We pull the camera back far enough to see the Sun and orbits.
// lookAt(0,0,0) ensures the camera points at the center (the Sun).

const camera = new THREE.PerspectiveCamera(
  60,
  window.innerWidth / window.innerHeight,
  0.1,
  5000
);
camera.position.set(0, 80, 250);
camera.lookAt(0, 0, 0);

// RENDERER
// WebGLRenderer draws 3D graphics in the browser.
// antialias: true makes edges smooth.
// setPixelRatio() ensures good quality on retina screens.
// We insert the canvas into <body>.
  
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setClearColor(0x000000);
document.body.appendChild(renderer.domElement);

// LIGHTING
// 1️⃣ PointLight at the Sun: Works like an actual light bulb → illuminates Earth and Moon.
// 2️⃣ Ambient light: Adds weak light so shadows aren't too dark.
// 3️⃣ Directional light: Simulates light from far away → improves texture visibility.
// Without good lighting, textures look flat or invisible.

const sunLight = new THREE.PointLight(0xffffff, 3);
sunLight.position.set(0, 0, 0);
scene.add(sunLight);

const ambient = new THREE.AmbientLight(0xffffff, 0.3);
scene.add(ambient);

const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
dirLight.position.set(200, 200, 200);
scene.add(dirLight);

// TEXTURE LOADER
// Loads images from the textures/ folder.
// These images are applied to the planets as texture maps.

const loader = new THREE.TextureLoader();
const texSun   = loader.load("textures/sunmap.jpg");
const texEarth = loader.load("textures/EarthMap_2500x1250.jpg");
const texMoon  = loader.load("textures/moonmap1k.jpg");

// SUN
// Mesh = geometry + material.
// Geometry = sphere radius 70.
// Material = MeshPhongMaterial (supports lighting + shininess).
// Texture = sunmap.jpg
// emissive makes the sun glow slightly.
  
const sun = new THREE.Mesh(
  new THREE.SphereGeometry(70, 64, 32),
  new THREE.MeshPhongMaterial({
    map: texSun,
    emissive: 0xffaa00,
    emissiveIntensity: 1.5,
  })
);
scene.add(sun);

// EARTH + ORBIT
// A pivot is like a parent object.
// The Earth is attached to pivotEarth.
// Rotating the pivot makes Earth orbit around the Sun.
// Earth is placed 150 units away from Sun.
  
const pivotEarth = new THREE.Object3D();
scene.add(pivotEarth);

const earth = new THREE.Mesh(
  new THREE.SphereGeometry(15, 32, 32),
  new THREE.MeshLambertMaterial({
    color: 0xffffff,
    map: texEarth
  })
);

pivotEarth.add(earth);
earth.position.set(150, 0, 0);


// MOON + ORBIT
// Moon orbits Earth → so pivotMoon is attached to Earth.
// Moon placed 19 units from Earth.
// 
// 
const pivotMoon = new THREE.Object3D();
earth.add(pivotMoon);

const moon = new THREE.Mesh(
  new THREE.SphereGeometry(5, 32, 32),
  new THREE.MeshLambertMaterial({
    color: 0xffffff,
    map: texMoon
  })
);

pivotMoon.add(moon);
moon.position.set(22, 0, 0);

// ORBIT TIMING
// Full circle = 2π radians.
// Earth makes one orbit every 60 seconds.
// Moon makes one orbit every 5 seconds.

const TAU = Math.PI * 2;

const EARTH_PERIOD = 60; // seconds for full orbit
const MOON_PERIOD  = 5;  // seconds for full orbit

 
// ANIMATION LOOP
// setAnimationLoop() runs 60 times per second.
// ms is milliseconds since page loaded. We convert to seconds.
// Earth and Moon rotate around their pivots.
// Sun rotates slightly.
// Redraw the scene every frame.
// 
  
renderer.setAnimationLoop((ms) => {
  const t = ms * 0.001;

  // Earth orbit
  pivotEarth.rotation.y = (t / EARTH_PERIOD) * TAU;

  // Moon orbit
  pivotMoon.rotation.y = (t / MOON_PERIOD) * TAU;

  // Sun rotation (optional)
  sun.rotation.y += 0.0015;

  renderer.render(scene, camera);
});


// RESIZE HANDLER
// If the user resizes the browser window, the camera & renderer adjust to avoid stretching.

window.addEventListener("resize", () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

</script>

</body>
</html>
